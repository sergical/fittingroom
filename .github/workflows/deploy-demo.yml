name: Deploy demo

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push supersedes an older run.
concurrency:
  group: deploy-demo
  cancel-in-progress: true

jobs:
  # The secrets context is not readable from a job-level `if`, so a tiny
  # first job turns "is the token set" into an output the deploy job can gate
  # on. Without this the whole workflow goes red on every push until the
  # repository owner adds the Cloudflare secrets.
  check-credentials:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo '::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set; skipping the demo deploy.'
          fi

  deploy:
    needs: check-credentials
    if: needs.check-credentials.outputs.configured == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      # The UI build produces both the plugin-served dist and the demo
      # site (dist-demo); its workspace dependencies build first.
      - run: pnpm --filter @fittingroom/ui... build
      # wrangler-action shells out to npm, which cannot resolve the
      # workspace: protocol this monorepo uses. Run the workspace's own
      # wrangler through pnpm instead, so the version comes from the lockfile.
      - run: pnpm --filter @fittingroom/ui exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
