name: Deploy demo

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push supersedes an older run.
concurrency:
  group: deploy-demo
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      # The UI build produces both the plugin-served dist and the demo
      # site (dist-demo); its workspace dependencies build first.
      - run: pnpm --filter @fittingroom/ui... build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: packages/ui
          command: deploy
