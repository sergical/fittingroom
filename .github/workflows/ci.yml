name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer commit on the same branch supersedes an older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # playwright-core never downloads browsers on install; the example
      # app's E2E test launches Chromium, so fetch it explicitly.
      - name: Install Chromium for the E2E test
        run: pnpm --filter @fittingroom/example-vite-app exec playwright-core install --with-deps chromium
      - run: pnpm test
